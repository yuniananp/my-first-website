<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的第一个网站</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #222;
            text-align: center;
        }

        .container {
            max-width: 800px;
            margin: 80px auto;
            padding: 40px 20px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        p {
            font-size: 20px;
            color: #666;
        }

        button {
            margin-top: 25px;
            padding: 14px 30px;
            border: none;
            border-radius: 30px;
            background: #1677ff;
            color: white;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>你好，世界！</h1>
        <p>这是我的第一个网站</p>
        <button onclick="alert('网站运行成功！')">
            点击我
        </button>
    </div>

</body>
</html>
